# Netlify build configuration for NOVA (React + Vite + Supabase).
# The backend is Supabase (Postgres + Auth + RLS) — there is no server to host.
# Set these environment variables in the Netlify UI
# (Site settings -> Environment variables):
#   VITE_SUPABASE_URL       = https://<project-ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY  = <your anon/public key>

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback: let React Router handle client-side routes
# instead of returning Netlify's 404 on refresh/deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
